    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: rgba(18, 24, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #0088cc;
            --accent-glow: #00d2ff;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 100px 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 136, 204, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 210, 255, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Top Header Badge */
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-glow);
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        /* Profile Avatar */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.5);
            background: #111;
        }

        .tricolor-bar {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #128807 66.66%);
            border-radius: 2px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* Title & Subtitle */
        .main-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .main-title span {
            color: var(--accent-glow);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .sub-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .disclaimer-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #a0aec0;
            margin-bottom: 25px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Primary Button */
        .telegram-btn {
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00b2ff 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 136, 204, 0.6);
        }

        .telegram-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        /* Features List */
        .features-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .feature-icon {
            width: 42px;
            height: 42px;
            background: rgba(0, 210, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--accent-glow);
            flex-shrink: 0;
        }

        .feature-info h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .feature-info p {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Sticky Bottom Bar for Mobile */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 10, 18, 0.9);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: center;
        }

        .sticky-footer .telegram-btn {
            margin-bottom: 0;
            padding: 14px 20px;
            font-size: 16px;
            max-width: 480px;
        }
    </style>
</head>
